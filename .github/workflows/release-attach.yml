name: Release · attach artifacts

# Tag-triggered: fires when semantic-release pushes a cli-v* / web-v* /
# desktop-v* tag (assuming SEMANTIC_RELEASE_TOKEN is configured — without
# a PAT the release.yml workflow falls back to invoking us via dispatch).
#
# Job: download the latest matching artifact from the relevant CI · X
# workflow on main, attach to the GitHub Release, and (web only) deploy
# to S3.
on:
  push:
    tags:
      - 'cli-v*'
      - 'web-v*'
      - 'desktop-v*'
      - 'shared-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach artifacts to (e.g. cli-v0.2.0, shared-v0.1.0)'
        required: true
        type: string

concurrency:
  group: release-attach-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # write to the GitHub Release
  actions: read     # download workflow artifacts
  id-token: write   # SLSA provenance signing (sigstore via OIDC)

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: 22

jobs:
  classify:
    name: Classify tag
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.cls.outputs.component }}
      tag: ${{ steps.cls.outputs.tag }}
    steps:
      - id: cls
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            cli-v*)     echo "component=cli"     >> "$GITHUB_OUTPUT" ;;
            web-v*)     echo "component=web"     >> "$GITHUB_OUTPUT" ;;
            desktop-v*) echo "component=desktop" >> "$GITHUB_OUTPUT" ;;
            shared-v*)  echo "component=shared"  >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Tag '$TAG' does not match cli-v*/web-v*/desktop-v*/shared-v*"
              exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────
  # CLI — download cli-* artifacts from the latest successful CI · cli
  # run on main, attach to the GitHub Release.
  # ─────────────────────────────────────────────────────────────────────
  attach-cli:
    name: Attach cli binaries
    needs: classify
    if: needs.classify.outputs.component == 'cli'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download latest cli artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID=$(gh run list \
                     --workflow "CI · cli" \
                     --branch main \
                     --status success \
                     --limit 1 \
                     --json databaseId \
                     --jq '.[0].databaseId // ""')
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::No successful CI · cli run on main found — nothing to attach."
            exit 1
          fi
          echo "Pulling cli artifacts from CI · cli run $RUN_ID"
          gh run download "$RUN_ID" --pattern 'cli-*' --dir staging/
          mkdir -p out
          # Each artifact is a directory; flatten into out/.
          find staging -type f -exec cp {} out/ \;
          ls -la out/
      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.classify.outputs.tag }}
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ─────────────────────────────────────────────────────────────────────
  # Desktop — same pattern: download installers from latest CI · desktop.
  # ─────────────────────────────────────────────────────────────────────
  attach-desktop:
    name: Attach desktop installers
    needs: classify
    if: needs.classify.outputs.component == 'desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download latest desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID=$(gh run list \
                     --workflow "CI · desktop" \
                     --branch main \
                     --status success \
                     --limit 1 \
                     --json databaseId \
                     --jq '.[0].databaseId // ""')
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::No successful CI · desktop run on main found — nothing to attach."
            exit 1
          fi
          echo "Pulling desktop artifacts from CI · desktop run $RUN_ID"
          gh run download "$RUN_ID" --pattern 'desktop-*' --dir staging/
          mkdir -p out
          find staging -type f -exec cp {} out/ \;
          ls -la out/
      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.classify.outputs.tag }}
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ─────────────────────────────────────────────────────────────────────
  # Web — download web-dist + deploy to Cloudflare Pages (project: repoguru,
  # matching the legacy levantar-ai/repoguru pipeline this repo replaces).
  # The GitHub Release is a doc anchor; the live URL is on Cloudflare.
  #
  # Required repo secrets (org-level on levantar-ai already):
  #   CLOUDFLARE_API_TOKEN
  #   CLOUDFLARE_ACCOUNT_ID
  # ─────────────────────────────────────────────────────────────────────
  attach-web:
    name: Deploy web to Cloudflare Pages
    needs: classify
    if: needs.classify.outputs.component == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download latest web-dist artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID=$(gh run list \
                     --workflow "CI · web" \
                     --branch main \
                     --status success \
                     --limit 1 \
                     --json databaseId \
                     --jq '.[0].databaseId // ""')
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::No successful CI · web run on main found — nothing to deploy."
            exit 1
          fi
          gh run download "$RUN_ID" --name web-dist --dir web/dist/
          ls -la web/dist/

      - name: Verify Cloudflare secrets
        id: cf_check
        run: |
          if [[ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" && -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare secrets missing — skipping deploy. Configure CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in repo settings."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf_check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=repoguru

      - name: Mark GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.classify.outputs.tag }}
          generate_release_notes: true
          body: |
            Web deployed to Cloudflare Pages (project: `repoguru`) at
            `${{ github.sha }}`.

  # ─────────────────────────────────────────────────────────────────────
  # Shared — no binary artefact (TS source consumed via pnpm workspace by
  # web/ + desktop/ in-tree). Creates the GitHub Release as a doc anchor
  # so `shared-v*` tags are visible in the release timeline.
  # ─────────────────────────────────────────────────────────────────────
  attach-shared:
    name: Mark shared Release
    needs: classify
    if: needs.classify.outputs.component == 'shared'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Mark GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.classify.outputs.tag }}
          generate_release_notes: true
          body: |
            Internal release of the shared TypeScript packages
            (`@repoguru/core`, `@repoguru/ui`, `@repoguru/browser-adapter`,
            `@repoguru/desktop-adapter`) at `${{ github.sha }}`.

            Consumed in-tree by web/ and desktop/ via pnpm workspace —
            this tag is for changelog/audit purposes only.
