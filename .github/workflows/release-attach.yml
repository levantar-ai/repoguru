name: Release · attach artifacts

# Tag-triggered (or workflow_dispatch fallback): resolves the tag's commit
# SHA, finds the matching CI · X run for THAT SHA, downloads its artifacts,
# and attaches them to the GitHub Release.
#
# "Matching" means same commit — not "latest successful on main". This
# eliminates the race where multiple main pushes land in quick succession
# and the wrong build gets attached.
#
# If the matching CI · X run is still in progress when the tag fires, we
# poll for up to 30 minutes before giving up.
on:
  push:
    tags:
      - 'cli-v*'
      - 'web-v*'
      - 'desktop-v*'
      - 'shared-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach artifacts to (e.g. cli-v0.2.0, shared-v0.1.0)'
        required: true
        type: string

concurrency:
  group: release-attach-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # write to the GitHub Release
  actions: read     # download workflow artifacts
  id-token: write   # SLSA provenance signing (sigstore via OIDC)

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: 22

jobs:
  resolve:
    name: Resolve tag → SHA + component
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      component: ${{ steps.cls.outputs.component }}
      tag:       ${{ steps.cls.outputs.tag }}
      sha:       ${{ steps.sha.outputs.value }}
    steps:
      - id: cls
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            cli-v*)     echo "component=cli"     >> "$GITHUB_OUTPUT" ;;
            web-v*)     echo "component=web"     >> "$GITHUB_OUTPUT" ;;
            desktop-v*) echo "component=desktop" >> "$GITHUB_OUTPUT" ;;
            shared-v*)  echo "component=shared"  >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Tag '$TAG' does not match cli-v*/web-v*/desktop-v*/shared-v*"
              exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.cls.outputs.tag }}
      - id: sha
        run: |
          # Resolve the commit the tag points at — works for both annotated
          # (semantic-release) and lightweight tags.
          SHA=$(git rev-list -n 1 "${{ steps.cls.outputs.tag }}")
          echo "Tag ${{ steps.cls.outputs.tag }} → $SHA"
          echo "value=$SHA" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────
  # CLI — find the CI · cli run for the tag's SHA, download cli-* artifacts,
  # attach to the Release.
  # ─────────────────────────────────────────────────────────────────────
  attach-cli:
    name: Attach cli binaries
    needs: resolve
    if: needs.resolve.outputs.component == 'cli'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Find CI · cli run for ${{ needs.resolve.outputs.sha }}
        id: find_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:  ${{ github.repository }}
          SHA:      ${{ needs.resolve.outputs.sha }}
        run: |
          for attempt in $(seq 1 60); do
            STATE=$(gh run list \
                      --workflow "CI · cli" \
                      --limit 50 \
                      --json databaseId,headSha,status,conclusion \
                      --jq "[.[] | select(.headSha == \"$SHA\")] | first" 2>/dev/null || echo "null")
            STATUS=$(echo "$STATE" | jq -r '.status // "missing"')
            CONCLUSION=$(echo "$STATE" | jq -r '.conclusion // ""')
            RUN_ID=$(echo "$STATE" | jq -r '.databaseId // ""')
            echo "[$(date -u +%H:%M:%S)] CI · cli for $SHA: status=$STATUS conclusion=$CONCLUSION run=$RUN_ID"
            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::CI · cli for $SHA concluded $CONCLUSION — refusing to attach broken artifacts"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI · cli run for $SHA after 30 minutes"
          exit 1
      - name: Download cli artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.find_run.outputs.id }}" --pattern 'cli-*' --dir staging/
          mkdir -p out
          find staging -type f -exec cp {} out/ \;
          ls -la out/
      - name: Attach to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ─────────────────────────────────────────────────────────────────────
  # Desktop — same pattern, different artifact glob.
  # ─────────────────────────────────────────────────────────────────────
  attach-desktop:
    name: Attach desktop installers
    needs: resolve
    if: needs.resolve.outputs.component == 'desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Find CI · desktop run for ${{ needs.resolve.outputs.sha }}
        id: find_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:  ${{ github.repository }}
          SHA:      ${{ needs.resolve.outputs.sha }}
        run: |
          for attempt in $(seq 1 60); do
            STATE=$(gh run list \
                      --workflow "CI · desktop" \
                      --limit 50 \
                      --json databaseId,headSha,status,conclusion \
                      --jq "[.[] | select(.headSha == \"$SHA\")] | first" 2>/dev/null || echo "null")
            STATUS=$(echo "$STATE" | jq -r '.status // "missing"')
            CONCLUSION=$(echo "$STATE" | jq -r '.conclusion // ""')
            RUN_ID=$(echo "$STATE" | jq -r '.databaseId // ""')
            echo "[$(date -u +%H:%M:%S)] CI · desktop for $SHA: status=$STATUS conclusion=$CONCLUSION run=$RUN_ID"
            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::CI · desktop for $SHA concluded $CONCLUSION"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI · desktop run for $SHA"
          exit 1
      - name: Download desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.find_run.outputs.id }}" --pattern 'desktop-*' --dir staging/
          mkdir -p out
          find staging -type f -exec cp {} out/ \;
          ls -la out/
      - name: Attach to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ─────────────────────────────────────────────────────────────────────
  # Web — find CI · web run for the tag's SHA, download web-dist, deploy
  # to Cloudflare Pages.
  # ─────────────────────────────────────────────────────────────────────
  attach-web:
    name: Deploy web to Cloudflare Pages
    needs: resolve
    if: needs.resolve.outputs.component == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      # wrangler-action auto-detects pnpm from the lockfile and tries to
      # install Wrangler via `pnpm`. Install pnpm first so that works.
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - name: Find CI · web run for ${{ needs.resolve.outputs.sha }}
        id: find_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:  ${{ github.repository }}
          SHA:      ${{ needs.resolve.outputs.sha }}
        run: |
          for attempt in $(seq 1 60); do
            STATE=$(gh run list \
                      --workflow "CI · web" \
                      --limit 50 \
                      --json databaseId,headSha,status,conclusion \
                      --jq "[.[] | select(.headSha == \"$SHA\")] | first" 2>/dev/null || echo "null")
            STATUS=$(echo "$STATE" | jq -r '.status // "missing"')
            CONCLUSION=$(echo "$STATE" | jq -r '.conclusion // ""')
            RUN_ID=$(echo "$STATE" | jq -r '.databaseId // ""')
            echo "[$(date -u +%H:%M:%S)] CI · web for $SHA: status=$STATUS conclusion=$CONCLUSION run=$RUN_ID"
            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::CI · web for $SHA concluded $CONCLUSION"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI · web run for $SHA"
          exit 1
      - name: Download web-dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.find_run.outputs.id }}" --name web-dist --dir web/dist/
          ls -la web/dist/

      - name: Verify Cloudflare secrets
        id: cf_check
        run: |
          if [[ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" && -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare secrets missing — skipping deploy. Configure CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      # Don't use cloudflare/wrangler-action — it tries to install wrangler
      # via the lockfile's detected pkg manager, which pnpm refuses for a
      # workspace root. Install wrangler directly via npm and call it.
      - name: Install wrangler
        if: steps.cf_check.outputs.ready == 'true'
        run: npm install -g wrangler@^3
      - name: Deploy to Cloudflare Pages
        if: steps.cf_check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --branch=main forces a PRODUCTION deploy. Without it, wrangler
        # reads the local git ref — and we're checked out at a tag
        # (detached HEAD) — so it defaults to a preview branch (`head`)
        # and repo.guru keeps serving the previous prod build.
        run: wrangler pages deploy web/dist --project-name=repoguru --branch=main
      - name: Mark GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          body: |
            Web deployed to Cloudflare Pages (project: `repoguru`) at
            `${{ needs.resolve.outputs.sha }}`.

  # ─────────────────────────────────────────────────────────────────────
  # Shared — no binary artefact (TS source consumed via pnpm workspace).
  # Creates the GitHub Release as a doc anchor.
  # ─────────────────────────────────────────────────────────────────────
  attach-shared:
    name: Mark shared Release
    needs: resolve
    if: needs.resolve.outputs.component == 'shared'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Mark GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          body: |
            Internal release of the shared TypeScript packages
            (`@repoguru/core`, `@repoguru/ui`, `@repoguru/browser-adapter`,
            `@repoguru/desktop-adapter`) at `${{ needs.resolve.outputs.sha }}`.

            Consumed in-tree by web/ and desktop/ via pnpm workspace —
            this tag is for changelog/audit purposes only.
