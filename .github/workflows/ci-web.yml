name: CI · web

# Pipeline stages:
#   guard       → cascade gate (CI · shared success-only when triggered upstream)
#   lint        → eslint + prettier
#   test        → vitest (unit + component)
#   security    → pnpm audit + license compliance
#   quality     → bundle-size budget + (advisory) coverage
#   build       → vite production bundle → workflow artifact
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'Makefile'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'Makefile'
      - '.github/workflows/ci-web.yml'
  workflow_run:
    workflows: ['CI · shared']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: 22

jobs:
  guard:
    name: 0 · guard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - if: github.event_name == 'workflow_run'
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "::warning::ci-shared concluded ${{ github.event.workflow_run.conclusion }} — skipping"
            exit 78
          fi
      - run: echo "✅ proceed"

  lint:
    name: 1 · lint + style
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter repoguru typecheck
      - name: ESLint
        run: pnpm --filter repoguru lint
      - name: Prettier
        run: pnpm --filter repoguru exec prettier --check .

  test:
    name: 2 · functional tests
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build shared (vitest pulls @repoguru/* dist)
        run: make build-shared
      - name: vitest
        run: pnpm --filter repoguru test

  security:
    name: 3 · code security
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (critical+)
        run: pnpm audit --audit-level=critical
      - name: License compliance (no GPL/AGPL/SSPL)
        run: make license-check

  quality:
    name: 4 · code quality
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build (size budget needs dist/)
        run: make build-web
      - name: Bundle-size budget
        run: cd web && pnpm run size
      - name: Coverage (advisory)
        continue-on-error: true
        run: pnpm --filter repoguru test -- --coverage || true

  build:
    name: 5 · build
    needs: [lint, test, security]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # vite reads VITE_* env vars at build time and bakes them into the
      # bundle. Without them the OAuth flow stays unconfigured (Connect
      # to GitHub button is greyed out) and the CORS proxy falls back to
      # its default. Secrets live on the repo; surface them only here so
      # PR/preview builds get an unauth'd app (safer).
      - name: Build (with OAuth env)
        env:
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          # GitHub App slug is public (it's literally in the OAuth URL).
          # Hardcoded to match the legacy levantar-ai/repoguru workflow.
          VITE_GITHUB_APP_SLUG: gitrepoguru
          VITE_CORS_PROXY_URL:  ${{ secrets.VITE_CORS_PROXY_URL }}
        run: make build-web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/**
          retention-days: 30
          if-no-files-found: error
