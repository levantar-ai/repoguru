name: CI · web

# Triggers:
#   • push/PR on web/**            → run CI + upload web/dist as artifact
#   • workflow_run from CI · shared (success) → cascade after shared lands
#   • workflow_dispatch            → on demand
#
# Artifact policy: every run on main publishes web/dist as workflow
# artifact `web-dist`. The release-attach workflow pulls it on web-v*
# tag and syncs to S3.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
  workflow_run:
    workflows: ['CI · shared']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: 22

jobs:
  guard:
    name: Guard (cascade gate)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check cascade preconditions
        if: github.event_name == 'workflow_run'
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "::warning::ci-shared concluded ${{ github.event.workflow_run.conclusion }} — skipping web pipeline"
            exit 78
          fi
      - run: echo "✅ proceed"

  ci:
    name: web CI
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make ci-web
      - name: License compliance
        run: make license-check
      - name: Bundle-size budget
        run: make size
      - name: Upload web/dist as artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/**
          retention-days: 30
          if-no-files-found: error
