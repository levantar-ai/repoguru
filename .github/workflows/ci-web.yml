name: CI · web

# Triggers:
#   • push/PR on web/**            → run CI directly
#   • workflow_run from CI · shared (success) → cascade run after shared lands
#   • tag web-v* or v*             → run CI then deploy to S3
#   • workflow_dispatch            → run CI / deploy on demand
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
    tags:
      - 'web-v*'
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
  workflow_run:
    workflows: ['CI · shared']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: 22

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Guard — when we're triggered by ci-shared completion, only continue
  # if it succeeded. Skipping when it failed prevents a wasted full run.
  # On other triggers (push, PR, tag, dispatch), this is a no-op.
  # ─────────────────────────────────────────────────────────────────────
  guard:
    name: Guard (cascade gate)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check cascade preconditions
        if: github.event_name == 'workflow_run'
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "::warning::ci-shared concluded ${{ github.event.workflow_run.conclusion }} — skipping web pipeline"
            exit 78  # neutral; not a failure
          fi
      - run: echo "✅ proceed"

  ci:
    name: web CI
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make ci-web
      - name: License compliance
        run: make license-check
      - name: Bundle-size budget
        run: make size

  # ─────────────────────────────────────────────────────────────────────
  # Deploy — only on tag pushes (web-v* or bare v*) or manual dispatch.
  # Pushes to main are CI-only; promote to staging by cutting a tag.
  #
  # Required repository secrets:
  #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  — IAM creds (s3:Put*, s3:Delete*, s3:ListBucket)
  #   AWS_REGION                                — e.g. eu-west-2
  #   AWS_S3_BUCKET                             — bucket name (no s3:// prefix)
  #   CLOUDFRONT_DISTRIBUTION_ID (optional)     — invalidate this distro post-deploy
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    name: web · S3 deploy
    needs: ci
    if: |
      startsWith(github.ref, 'refs/tags/web-v') ||
      startsWith(github.ref, 'refs/tags/v')    ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make build-web
      - name: Verify AWS secrets
        id: aws_check
        run: |
          if [[ -n "${{ secrets.AWS_S3_BUCKET }}" && -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::S3 secrets missing — skipping deploy. Set AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, AWS_S3_BUCKET in repo settings."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure AWS credentials
        if: steps.aws_check.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Sync bundle to S3
        if: steps.aws_check.outputs.ready == 'true'
        run: |
          # Hashed assets: cache forever (filename change = automatic cache bust).
          aws s3 sync web/dist/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          # index.html is the entry that points at fresh hashes — never cache it.
          aws s3 cp web/dist/index.html "s3://${{ secrets.AWS_S3_BUCKET }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"
      - name: Invalidate CloudFront
        if: steps.aws_check.outputs.ready == 'true' && env.CLOUDFRONT_ID != ''
        env:
          CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*"
