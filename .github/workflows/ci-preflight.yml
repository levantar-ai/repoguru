name: CI · preflight

# Cheap, repo-wide checks that fan out on every PR / push:
#
#   1 · format         prettier + rustfmt across the whole tree
#   2 · secrets        gitleaks scan of working tree + git history
#   3 · dependency     pnpm audit + cargo audit (CVEs)
#   4 · commitlint     Conventional Commit format on PR titles
#   5 · CodeQL         JS/TS static analysis (security + quality)
#   6 · Semgrep        cross-language SAST
#   7 · dep-review     PR-only license + advisory diff
#
# Per-component pipelines live in ci-{shared,cli,web,desktop}.yml — each
# has its own lint / test / security / quality / build stages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # CodeQL + Semgrep upload SARIF
  pull-requests: read      # dep-review reads PR file changes
  actions: read            # codeql-action telemetry queries the run

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: 22

jobs:
  format:
    name: 1 · format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: pnpm install --frozen-lockfile
      - run: make format-check

  secrets:
    name: 2 · secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans full history
      # The official `gitleaks/gitleaks-action@v2` requires a paid licence
      # for org-owned repos. Install the OSS binary directly instead — same
      # detection engine, no licence gate.
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-banner --verbose

  audit:
    name: 3 · dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: cli }
      - run: pnpm install --frozen-lockfile
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.20
      - name: Run audit
        # Upstream rustsec/advisory-db occasionally lands a malformed TOML
        # advisory which crashes cargo-audit's parser before any CVE check.
        # Don't gate the build on that — keep the run visible (warning),
        # surface real CVEs via cargo-deny in ci-cli's security stage.
        continue-on-error: true
        run: make audit

  commitlint:
    name: 4 · commit message format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint PR title
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint

  # ─────────────────────────────────────────────────────────────────────
  # 5 · CodeQL — JS/TS static analysis. Uploads SARIF to the Security tab.
  # Advisory until Advanced Security is enabled on this private repo —
  # without it, the SARIF upload returns "Code Security must be enabled".
  # The analysis still runs and produces useful local logs either way.
  # ─────────────────────────────────────────────────────────────────────
  codeql:
    name: 5 · CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # ─────────────────────────────────────────────────────────────────────
  # 6 · Semgrep — cross-language SAST. Advisory for the same reason as
  # CodeQL: SARIF upload requires Code Security to be enabled.
  # ─────────────────────────────────────────────────────────────────────
  semgrep:
    name: 6 · Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config auto --sarif --output semgrep.sarif || true
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  # ─────────────────────────────────────────────────────────────────────
  # 7 · Dependency Review — PR-only. Diffs added/removed deps and flags
  # known-bad licenses or advisories in the diff itself.
  # ─────────────────────────────────────────────────────────────────────
  dep-review:
    name: 7 · Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0, SSPL-1.0
