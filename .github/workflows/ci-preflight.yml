name: CI · preflight

# Cheap, repo-wide checks that fan out on every PR / push:
#
#   format     → prettier + rustfmt across the whole tree
#   secrets    → gitleaks scan of working tree + git history
#   audit      → pnpm audit + cargo audit (CVEs)
#   commitlint → Conventional Commit format on PR titles
#
# Per-component pipelines live in ci-{shared,cli,web,desktop}.yml — each
# has its own lint / test / security / quality / build stages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: 22

jobs:
  format:
    name: 1 · format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: pnpm install --frozen-lockfile
      - run: make format-check

  secrets:
    name: 2 · secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans full history
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: 3 · dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: cli }
      - run: pnpm install --frozen-lockfile
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.20
      - run: make audit

  commitlint:
    name: 4 · commit message format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint PR title
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint
