name: CI

# Branch policy:
#   • PRs: every relevant component runs based on the changed paths.
#   • main pushes: same path filtering; release.yml takes over for tags.
#
# Path-based triggering (per andy@):
#   • cli/** or spec/**       → only the CLI pipeline runs
#   • web/**                  → only the web pipeline runs
#   • desktop/**              → only the desktop pipeline runs
#   • shared/**, root configs → all three component pipelines run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 10.28.2
  NODE_VERSION: 22

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # changes — detect which top-level directories were touched. Other jobs
  # gate on the booleans this exposes (see needs.changes.outputs.*).
  # ─────────────────────────────────────────────────────────────────────
  changes:
    name: Detect component changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read  # paths-filter needs this on PRs
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      shared: ${{ steps.filter.outputs.shared }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'cli/**'
              - 'spec/**'
            web:
              - 'web/**'
            desktop:
              - 'desktop/**'
            shared:
              - 'shared/**'
            # Root-level changes (workflows, lockfile, top-level configs)
            # cascade to every component because they alter the build env.
            root:
              - '.github/workflows/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'Makefile'
              - 'tsconfig*.json'

  # ─────────────────────────────────────────────────────────────────────
  # Pre-flight — fast checks (format + typecheck) across whatever
  # components are in scope. Runs whenever ANY change is detected.
  # ─────────────────────────────────────────────────────────────────────
  preflight:
    name: Pre-flight (format + typecheck)
    needs: changes
    if: |
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: make format-check
      - run: make typecheck

  # ─────────────────────────────────────────────────────────────────────
  # Component matrix — each fires only when its component (or anything
  # cross-cutting: shared/, root configs) actually changed.
  # ─────────────────────────────────────────────────────────────────────
  ci-cli:
    name: CI · cli (Rust)
    needs: [changes, preflight]
    # CLI is independent of shared/ (Rust crate), but a root-config or
    # workflow change should still re-run it to be safe.
    if: |
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          shared-key: cli-release
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: make ci-cli

  ci-shared:
    name: CI · shared (TypeScript)
    needs: [changes, preflight]
    if: |
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make ci-shared

  ci-web:
    name: CI · web (Vite)
    needs: [changes, ci-shared]
    if: |
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make ci-web
      - name: Bundle-size budget
        run: make size

  ci-desktop:
    name: CI · desktop (Electron renderer)
    needs: [changes, ci-shared]
    if: |
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make ci-desktop

  # ─────────────────────────────────────────────────────────────────────
  # Security + compliance — runs whenever any pnpm or cargo workspace was
  # touched (which transitively means any component change).
  # ─────────────────────────────────────────────────────────────────────
  audit:
    name: Audit (pnpm + cargo)
    needs: [changes, preflight]
    if: |
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: pnpm install --frozen-lockfile
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.20
      - run: make audit

  licenses:
    name: License compliance (web)
    needs: [changes, preflight]
    if: |
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make license-check

  # ─────────────────────────────────────────────────────────────────────
  # commitlint — PR titles must be Conventional Commits because we squash
  # and release-please reads the merge subject for semver.
  # ─────────────────────────────────────────────────────────────────────
  commitlint:
    name: Commit message format (PR title)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint PR title against Conventional Commits
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint

  # ─────────────────────────────────────────────────────────────────────
  # Final gate — succeeds when no required check failed. Skipped checks
  # (because their paths weren't touched) count as "success" for the
  # purposes of this gate, so a CLI-only change doesn't fail because the
  # web pipeline didn't fire.
  # ─────────────────────────────────────────────────────────────────────
  required-checks:
    name: Required checks
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - preflight
      - ci-cli
      - ci-shared
      - ci-web
      - ci-desktop
      - audit
      - licenses
      - commitlint
    steps:
      - name: Evaluate gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Fail if any required check failed or was cancelled. Skipped
          # checks (path filter) are NOT failures.
          if echo "$NEEDS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::one or more required checks failed"
            echo "$NEEDS"
            exit 1
          fi
          echo "✅ all required checks passed (or were correctly skipped)"
