name: CI · desktop

# Triggers:
#   • push/PR on desktop/**           → run CI directly
#   • workflow_run from CI · shared   → cascade after shared lands (renderer
#                                       depends on @repoguru/* TS packages)
#   • workflow_run from CI · cli      → cascade after cli lands (the desktop
#                                       installer EMBEDS the repoanalyze binary
#                                       in resources/bin/, so a CLI change
#                                       should re-validate the desktop build)
#   • tag desktop-v* or v*            → CI then package + publish Electron
#                                       installers (the publish job pulls the
#                                       latest stable cli-v* release and bakes
#                                       its binaries into resources/bin/ before
#                                       electron-builder runs)
#   • workflow_dispatch               → on demand
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/ci-desktop.yml'
    tags:
      - 'desktop-v*'
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/ci-desktop.yml'
  workflow_run:
    workflows: ['CI · shared', 'CI · cli']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write   # publish-job uploads installers to a GitHub Release
  actions: read     # wait-for-cli reads sibling workflow status via gh CLI

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: 22

jobs:
  guard:
    name: Guard (cascade gate)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check cascade preconditions
        if: github.event_name == 'workflow_run'
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "::warning::${{ github.event.workflow_run.name }} concluded ${{ github.event.workflow_run.conclusion }} — skipping desktop pipeline"
            exit 78
          fi
      - run: echo "✅ proceed"

  # ─────────────────────────────────────────────────────────────────────
  # Wait for CI · cli on this commit. When shared lands, ci-cli, ci-web
  # AND ci-desktop all fan out from its workflow_run. Desktop additionally
  # depends on CLI (it bundles the binary) — so we hold here until CLI
  # finishes for this same SHA. If CLI didn't run for this SHA (cli/** was
  # untouched and there's no cascaded ci-cli), we proceed immediately.
  # ─────────────────────────────────────────────────────────────────────
  wait-for-cli:
    name: Wait for CI · cli
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve target SHA
        id: sha
        run: |
          # workflow_run cascades carry the upstream SHA on github.event.workflow_run.head_sha;
          # for direct push/PR/tag/dispatch, github.sha is correct.
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Poll ci-cli status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.value }}
        run: |
          # Brief pause so a freshly-triggered ci-cli has time to register.
          sleep 10
          for attempt in $(seq 1 60); do
            STATE=$(gh run list \
                      --workflow "CI · cli" \
                      --limit 20 \
                      --json databaseId,headSha,status,conclusion \
                      --jq "[.[] | select(.headSha == \"$SHA\")] | first" 2>/dev/null || echo "")
            if [[ -z "$STATE" || "$STATE" == "null" ]]; then
              echo "::notice::No CI · cli run for $SHA — proceeding without wait"
              exit 0
            fi
            STATUS=$(echo "$STATE" | jq -r '.status // ""')
            CONCLUSION=$(echo "$STATE" | jq -r '.conclusion // ""')
            RUN_ID=$(echo "$STATE" | jq -r '.databaseId')
            echo "[$(date -u +%H:%M:%S)] CI · cli run $RUN_ID: status=$STATUS conclusion=$CONCLUSION"
            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "✅ CI · cli succeeded — proceeding"
                exit 0
              fi
              echo "::error::CI · cli concluded $CONCLUSION — aborting desktop"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI · cli after 30 minutes"
          exit 1

  ci:
    name: desktop CI
    needs: wait-for-cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make ci-desktop

  # ─────────────────────────────────────────────────────────────────────
  # Publish — only on tag pushes (desktop-v* or bare v*). One runner per
  # OS so electron-builder runs natively (cross-build for codesigning is
  # fragile). Each job:
  #   1. Downloads the latest cli-v* release binaries
  #   2. Renames them into desktop's expected naming (resources/bin/)
  #   3. Runs electron-builder (the binaries get bundled via extraResources)
  #   4. Uploads the installer to the GitHub Release
  # ─────────────────────────────────────────────────────────────────────
  publish:
    name: publish · ${{ matrix.os }}
    needs: ci
    if: |
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  task: package-desktop-linux, glob: 'desktop/release/*.{AppImage,deb}' }
          - { os: macos-latest,   task: package-desktop-mac,   glob: 'desktop/release/*.{dmg,zip}'      }
          - { os: windows-latest, task: package-desktop-win,   glob: 'desktop/release/*.{exe,msi}'      }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ────────────────────────────────────────────────────────────────
      # Stage the latest stable CLI binaries into desktop/resources/bin/
      # so electron-builder's extraResources bundles them. The desktop
      # release pins to whatever cli-v* tag is most recent — this gives
      # deterministic installers (no "built today against tip-of-main").
      # ────────────────────────────────────────────────────────────────
      - name: Stage CLI binaries from latest cli-v* release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p desktop/resources/bin
          LATEST=$(gh release list --limit 50 \
                     --json tagName \
                     --jq '[.[] | select(.tagName | startswith("cli-v"))] | first | .tagName // ""')
          if [[ -z "$LATEST" ]]; then
            echo "::warning::No cli-v* release found. Building CLI from this checkout as a fallback."
            # Fallback: build the CLI for the host (this runner's) target only.
            # Good enough to ship A desktop installer; full multi-arch needs
            # a published cli-v* release.
            cd cli && cargo build --release --bin repoanalyze && cd ..
            case "${{ runner.os }}" in
              Linux)   cp cli/target/release/repoanalyze     desktop/resources/bin/repoanalyze-linux-x86_64 ;;
              macOS)   cp cli/target/release/repoanalyze     desktop/resources/bin/repoanalyze-darwin-$(uname -m | sed 's/arm64/aarch64/' | sed 's/x86_64/x86_64/') ;;
              Windows) cp cli/target/release/repoanalyze.exe desktop/resources/bin/repoanalyze-win32-x86_64.exe ;;
            esac
          else
            echo "Pulling CLI binaries from $LATEST"
            gh release download "$LATEST" --pattern 'repoanalyze-*' --dir desktop/resources/bin/
            # Rename Rust target-triple naming → desktop's runtime convention.
            # See desktop/electron/process-manager.ts — these names are checked at runtime.
            cd desktop/resources/bin
            for src in repoanalyze-x86_64-unknown-linux-gnu \
                       repoanalyze-aarch64-apple-darwin \
                       repoanalyze-x86_64-apple-darwin \
                       repoanalyze-x86_64-pc-windows-msvc.exe; do
              [[ -f "$src" ]] || continue
              case "$src" in
                *linux-gnu)            mv "$src" repoanalyze-linux-x86_64 ;;
                *aarch64-apple-darwin) mv "$src" repoanalyze-darwin-aarch64 ;;
                *x86_64-apple-darwin)  mv "$src" repoanalyze-darwin-x86_64 ;;
                *windows-msvc.exe)     mv "$src" repoanalyze-win32-x86_64.exe ;;
              esac
            done
          fi
          # macOS / Linux runners need the binaries executable for electron-builder
          # to preserve the bit through to the installed app.
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x desktop/resources/bin/repoanalyze-* 2>/dev/null || true
          fi
          ls -la desktop/resources/bin/

      - name: Package
        run: make ${{ matrix.task }}

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.glob }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc.') || contains(github.ref, '-beta.') }}
