name: CI · desktop

# Triggers:
#   • push/PR on desktop/**         → run CI directly
#   • workflow_run from CI · shared / CI · cli (success) → cascade
#   • workflow_dispatch             → on demand
#
# Artifact policy: every run on main packages Electron installers for all
# 3 OSes and uploads them as workflow artifacts. The release-attach
# workflow pulls them when a desktop-v* tag fires.
#
# Desktop bundles the CLI binary (extraResources → resources/bin/), so the
# packaging job always pulls the latest cli artifact (or falls back to
# building from source if no cli artifact exists yet).
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/ci-desktop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/ci-desktop.yml'
  workflow_run:
    workflows: ['CI · shared', 'CI · cli']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read     # wait-for-cli + cli-artifact download read sibling runs

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: 22

jobs:
  guard:
    name: Guard (cascade gate)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check cascade preconditions
        if: github.event_name == 'workflow_run'
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "::warning::${{ github.event.workflow_run.name }} concluded ${{ github.event.workflow_run.conclusion }} — skipping desktop pipeline"
            exit 78
          fi
      - run: echo "✅ proceed"

  # ─────────────────────────────────────────────────────────────────────
  # Wait for CI · cli on this commit. Desktop bundles the CLI binary, so
  # we hold here until cli's run for this same SHA finishes. No-op when
  # cli/** wasn't touched (no ci-cli run for this SHA).
  # ─────────────────────────────────────────────────────────────────────
  wait-for-cli:
    name: Wait for CI · cli
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve target SHA
        id: sha
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Poll ci-cli status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.value }}
        run: |
          sleep 10
          for attempt in $(seq 1 60); do
            STATE=$(gh run list \
                      --workflow "CI · cli" \
                      --limit 20 \
                      --json databaseId,headSha,status,conclusion \
                      --jq "[.[] | select(.headSha == \"$SHA\")] | first" 2>/dev/null || echo "")
            if [[ -z "$STATE" || "$STATE" == "null" ]]; then
              echo "::notice::No CI · cli run for $SHA — proceeding without wait"
              exit 0
            fi
            STATUS=$(echo "$STATE" | jq -r '.status // ""')
            CONCLUSION=$(echo "$STATE" | jq -r '.conclusion // ""')
            RUN_ID=$(echo "$STATE" | jq -r '.databaseId')
            echo "[$(date -u +%H:%M:%S)] CI · cli run $RUN_ID: status=$STATUS conclusion=$CONCLUSION"
            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "✅ CI · cli succeeded — proceeding"
                exit 0
              fi
              echo "::error::CI · cli concluded $CONCLUSION — aborting desktop"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI · cli after 30 minutes"
          exit 1

  # ─────────────────────────────────────────────────────────────────────
  # CI — typecheck + renderer build on Linux. Fast feedback path for PRs.
  # ─────────────────────────────────────────────────────────────────────
  ci:
    name: desktop CI
    needs: wait-for-cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make ci-desktop

  # ─────────────────────────────────────────────────────────────────────
  # Package — multi-OS Electron installers as workflow artifacts. Skipped
  # on PRs (matrix is heavy). Each runner pulls cli artifacts from the
  # most recent successful CI · cli run on main and bundles them in.
  # ─────────────────────────────────────────────────────────────────────
  package:
    name: package · ${{ matrix.os }}
    needs: ci
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  task: package-desktop-linux, glob: 'desktop/release/*.{AppImage,deb}' }
          - { os: macos-latest,   task: package-desktop-mac,   glob: 'desktop/release/*.{dmg,zip}'      }
          - { os: windows-latest, task: package-desktop-win,   glob: 'desktop/release/*.{exe,msi}'      }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ────────────────────────────────────────────────────────────────
      # Stage CLI binaries from the latest successful CI · cli run on
      # main into desktop/resources/bin/. Falls back to building from
      # source if no cli run is found (bootstrap).
      # ────────────────────────────────────────────────────────────────
      - name: Stage CLI binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p desktop/resources/bin
          # Find the most recent successful CI · cli run on main and download every cli-* artifact.
          RUN_ID=$(gh run list \
                     --workflow "CI · cli" \
                     --branch main \
                     --status success \
                     --limit 1 \
                     --json databaseId \
                     --jq '.[0].databaseId // ""')
          if [[ -z "$RUN_ID" ]]; then
            echo "::warning::No successful CI · cli run on main — building CLI from this checkout."
            cd cli && cargo build --release --bin repoanalyze && cd ..
            case "${{ runner.os }}" in
              Linux)   cp cli/target/release/repoanalyze     desktop/resources/bin/repoanalyze-linux-x86_64 ;;
              macOS)   cp cli/target/release/repoanalyze     desktop/resources/bin/repoanalyze-darwin-$(uname -m | sed 's/arm64/aarch64/') ;;
              Windows) cp cli/target/release/repoanalyze.exe desktop/resources/bin/repoanalyze-win32-x86_64.exe ;;
            esac
          else
            echo "Pulling cli artifacts from CI · cli run $RUN_ID"
            gh run download "$RUN_ID" --pattern 'cli-*' --dir /tmp/cli-artifacts/
            # Each artifact is a directory named cli-<target>; flatten + rename
            # to desktop's runtime convention (see desktop/electron/process-manager.ts).
            for dir in /tmp/cli-artifacts/cli-*; do
              [[ -d "$dir" ]] || continue
              for f in "$dir"/*; do
                base=$(basename "$f")
                case "$base" in
                  *linux-gnu)            cp "$f" desktop/resources/bin/repoanalyze-linux-x86_64 ;;
                  *aarch64-apple-darwin) cp "$f" desktop/resources/bin/repoanalyze-darwin-aarch64 ;;
                  *x86_64-apple-darwin)  cp "$f" desktop/resources/bin/repoanalyze-darwin-x86_64 ;;
                  *windows-msvc.exe)     cp "$f" desktop/resources/bin/repoanalyze-win32-x86_64.exe ;;
                esac
              done
            done
          fi
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x desktop/resources/bin/repoanalyze-* 2>/dev/null || true
          fi
          ls -la desktop/resources/bin/

      - name: Package
        run: make ${{ matrix.task }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: ${{ matrix.glob }}
          retention-days: 30
          if-no-files-found: error
