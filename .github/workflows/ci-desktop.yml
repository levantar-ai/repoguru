name: CI · desktop

# Pipeline stages:
#   guard         → cascade gate (CI · shared / CI · cli success-only)
#   wait-for-cli  → block until ci-cli completes for this SHA (desktop bundles its binary)
#   lint          → typecheck + prettier
#   test          → vitest (when present)
#   security      → pnpm audit + electronegativity (Electron-specific SAST)
#   quality       → renderer bundle-size + typecheck strict
#   build         → matrix electron-builder per OS → workflow artifacts (with bundled CLI)
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'Makefile'
      - '.github/workflows/ci-desktop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'Makefile'
      - '.github/workflows/ci-desktop.yml'
  workflow_run:
    workflows: ['CI · shared', 'CI · cli']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: 22

jobs:
  guard:
    name: 0 · guard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - if: github.event_name == 'workflow_run'
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "::warning::${{ github.event.workflow_run.name }} concluded ${{ github.event.workflow_run.conclusion }} — skipping"
            exit 78
          fi
      - run: echo "✅ proceed"

  wait-for-cli:
    name: 0b · wait for CI · cli
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - id: sha
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Poll ci-cli status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.value }}
        run: |
          sleep 10
          for attempt in $(seq 1 60); do
            STATE=$(gh run list --workflow "CI · cli" --limit 20 \
                      --json databaseId,headSha,status,conclusion \
                      --jq "[.[] | select(.headSha == \"$SHA\")] | first" 2>/dev/null || echo "")
            if [[ -z "$STATE" || "$STATE" == "null" ]]; then
              echo "::notice::No CI · cli run for $SHA — proceeding"; exit 0
            fi
            STATUS=$(echo "$STATE" | jq -r '.status // ""')
            CONCLUSION=$(echo "$STATE" | jq -r '.conclusion // ""')
            echo "[$(date -u +%H:%M:%S)] CI · cli: status=$STATUS conclusion=$CONCLUSION"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] && exit 0
              echo "::error::CI · cli concluded $CONCLUSION"; exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out after 30 minutes"; exit 1

  lint:
    name: 1 · lint + style
    needs: wait-for-cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter repoguru-desktop typecheck
      - name: Prettier
        run: pnpm --filter repoguru exec prettier --check '../desktop/**/*.{ts,tsx,json,md,yml}'

  test:
    name: 2 · functional tests
    needs: wait-for-cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Tests (no-op when no test script)
        run: make test-desktop

  security:
    name: 3 · code security
    needs: wait-for-cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (critical+)
        run: pnpm audit --audit-level=critical
      - name: Electronegativity (Electron-specific SAST)
        # Advisory until we triage the baseline — Electron defaults trip
        # several rules even on a clean app.
        continue-on-error: true
        run: |
          npx --yes @doyensec/electronegativity \
            -i desktop/electron \
            -o electronegativity-report.csv \
            -s

  quality:
    name: 4 · code quality
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Renderer build (advisory size check)
        run: make build-desktop

  # ─────────────────────────────────────────────────────────────────────
  # 5. Build artifacts — multi-OS Electron installers with bundled CLI.
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: 5 · build · ${{ matrix.os }}
    needs: [lint, test, security]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  task: package-desktop-linux, glob: 'desktop/release/*.{AppImage,deb}' }
          - { os: macos-latest,   task: package-desktop-mac,   glob: 'desktop/release/*.{dmg,zip}'      }
          - { os: windows-latest, task: package-desktop-win,   glob: 'desktop/release/*.{exe,msi}'      }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Stage CLI binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p desktop/resources/bin
          RUN_ID=$(gh run list --workflow "CI · cli" --branch main --status success --limit 1 \
                     --json databaseId --jq '.[0].databaseId // ""')
          if [[ -z "$RUN_ID" ]]; then
            echo "::warning::No successful CI · cli run on main — building from source"
            cd cli && cargo build --release --bin repoanalyze && cd ..
            case "${{ runner.os }}" in
              Linux)   cp cli/target/release/repoanalyze     desktop/resources/bin/repoanalyze-linux-x86_64 ;;
              macOS)   cp cli/target/release/repoanalyze     desktop/resources/bin/repoanalyze-darwin-$(uname -m | sed 's/arm64/aarch64/') ;;
              Windows) cp cli/target/release/repoanalyze.exe desktop/resources/bin/repoanalyze-win32-x86_64.exe ;;
            esac
          else
            gh run download "$RUN_ID" --pattern 'cli-*' --dir /tmp/cli-artifacts/
            for dir in /tmp/cli-artifacts/cli-*; do
              [[ -d "$dir" ]] || continue
              for f in "$dir"/*; do
                base=$(basename "$f")
                case "$base" in
                  *linux-gnu)            cp "$f" desktop/resources/bin/repoanalyze-linux-x86_64 ;;
                  *aarch64-apple-darwin) cp "$f" desktop/resources/bin/repoanalyze-darwin-aarch64 ;;
                  *x86_64-apple-darwin)  cp "$f" desktop/resources/bin/repoanalyze-darwin-x86_64 ;;
                  *windows-msvc.exe)     cp "$f" desktop/resources/bin/repoanalyze-win32-x86_64.exe ;;
                esac
              done
            done
          fi
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x desktop/resources/bin/repoanalyze-* 2>/dev/null || true
          fi
          ls -la desktop/resources/bin/

      - name: Package
        run: make ${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: ${{ matrix.glob }}
          retention-days: 30
          if-no-files-found: error
