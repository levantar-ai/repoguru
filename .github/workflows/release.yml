name: Release (semantic-release)

# Trunk-based: every push to main runs semantic-release per component.
# semantic-release is installed via root devDeps; we run it directly
# (./node_modules/.bin/semantic-release) from each component's directory
# so its module resolution walks up and finds the plugins cleanly.
#
# After cutting a tag, this workflow ALWAYS dispatches release-attach.yml
# explicitly. We don't rely on tag-push triggers because GITHUB_TOKEN-pushed
# tags don't fire downstream workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.2

jobs:
  release-shared:
    name: Release · shared
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - run: pnpm install --frozen-lockfile
      - id: semrel
        working-directory: shared
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          OUTPUT=$(../node_modules/.bin/semantic-release 2>&1 | tee /dev/stderr || true)
          TAG=$(echo "$OUTPUT" | grep -oE 'shared-v[0-9.]+' | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"
      - name: Dispatch release-attach
        if: steps.semrel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.tag }}
        run: gh workflow run release-attach.yml -f tag="$TAG"

  release-cli:
    name: Release · cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - run: pnpm install --frozen-lockfile
      - id: semrel
        working-directory: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          OUTPUT=$(../node_modules/.bin/semantic-release 2>&1 | tee /dev/stderr || true)
          TAG=$(echo "$OUTPUT" | grep -oE 'cli-v[0-9.]+' | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"
      - name: Dispatch release-attach
        if: steps.semrel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.tag }}
        run: gh workflow run release-attach.yml -f tag="$TAG"

  release-web:
    name: Release · web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - run: pnpm install --frozen-lockfile
      - id: semrel
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          OUTPUT=$(../node_modules/.bin/semantic-release 2>&1 | tee /dev/stderr || true)
          TAG=$(echo "$OUTPUT" | grep -oE 'web-v[0-9.]+' | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"
      - name: Dispatch release-attach
        if: steps.semrel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.tag }}
        run: gh workflow run release-attach.yml -f tag="$TAG"

  release-desktop:
    name: Release · desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - run: pnpm install --frozen-lockfile
      - id: semrel
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          OUTPUT=$(../node_modules/.bin/semantic-release 2>&1 | tee /dev/stderr || true)
          TAG=$(echo "$OUTPUT" | grep -oE 'desktop-v[0-9.]+' | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"
      - name: Dispatch release-attach
        if: steps.semrel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.tag }}
        run: gh workflow run release-attach.yml -f tag="$TAG"
