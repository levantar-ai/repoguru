name: Release (semantic-release)

# Trunk-based: every push to main runs semantic-release per component.
# semantic-release scans Conventional Commits since the last tag matching
# tagFormat (e.g. cli-v*), decides the next version, creates the tag +
# GitHub Release.
#
# Per-component scope filtering — only commits whose scope matches the
# component count toward its release:
#   feat(cli):  …  → cli minor bump
#   fix(web):   …  → web patch bump
#   feat!(desktop): …  → desktop major bump
#
# After cutting a tag, this workflow ALWAYS dispatches release-attach.yml
# explicitly. We don't rely on tag-push triggers because GITHUB_TOKEN-pushed
# tags don't fire downstream workflows. No PAT secret required.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write   # for `gh workflow run release-attach.yml`

env:
  NODE_VERSION: 22

jobs:
  release-shared:
    name: Release · shared
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pre-install semantic-release-monorepo (cycjimmy install can be flaky)
        run: npm install -g semantic-release-monorepo conventional-changelog-conventionalcommits
      - id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: shared
          extra_plugins: |
            conventional-changelog-conventionalcommits
            semantic-release-monorepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch release-attach
        if: steps.semrel.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.new_release_git_tag }}
        run: |
          echo "Dispatching release-attach.yml for $TAG"
          gh workflow run release-attach.yml -f tag="$TAG"

  release-cli:
    name: Release · cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pre-install semantic-release-monorepo (cycjimmy install can be flaky)
        run: npm install -g semantic-release-monorepo conventional-changelog-conventionalcommits
      - id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: cli
          extra_plugins: |
            conventional-changelog-conventionalcommits
            semantic-release-monorepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch release-attach
        if: steps.semrel.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.new_release_git_tag }}
        run: |
          echo "Dispatching release-attach.yml for $TAG"
          gh workflow run release-attach.yml -f tag="$TAG"

  release-web:
    name: Release · web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pre-install semantic-release-monorepo (cycjimmy install can be flaky)
        run: npm install -g semantic-release-monorepo conventional-changelog-conventionalcommits
      - id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: web
          extra_plugins: |
            conventional-changelog-conventionalcommits
            semantic-release-monorepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch release-attach
        if: steps.semrel.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.new_release_git_tag }}
        run: |
          echo "Dispatching release-attach.yml for $TAG"
          gh workflow run release-attach.yml -f tag="$TAG"

  release-desktop:
    name: Release · desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pre-install semantic-release-monorepo (cycjimmy install can be flaky)
        run: npm install -g semantic-release-monorepo conventional-changelog-conventionalcommits
      - id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: desktop
          extra_plugins: |
            conventional-changelog-conventionalcommits
            semantic-release-monorepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch release-attach
        if: steps.semrel.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.new_release_git_tag }}
        run: |
          echo "Dispatching release-attach.yml for $TAG"
          gh workflow run release-attach.yml -f tag="$TAG"
