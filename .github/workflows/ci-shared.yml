name: CI · shared

# Pipeline stages:
#   lint        → typecheck + prettier
#   test        → vitest (best-effort: only packages with a test script)
#   security    → pnpm audit
#   quality     → strict tsc, no implicit any
#   build       → tsc emit dist/ → workflow artifact
#
# When this workflow succeeds on main, ci-cli + ci-web + ci-desktop fan out
# via `workflow_run` (each listens for our completion).
on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/ci-shared.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/ci-shared.yml'
  workflow_dispatch:

concurrency:
  group: ci-shared-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: 22

jobs:
  lint:
    name: 1 · lint + style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck shared/*
        run: make typecheck-shared
      - name: Prettier check on shared/
        working-directory: web
        run: pnpm exec prettier --check '../shared/**/*.{ts,tsx,json,md}'

  test:
    name: 2 · functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Tests (skip when no test script)
        run: make test-shared

  security:
    name: 3 · code security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (critical+)
        run: pnpm audit --audit-level=critical

  quality:
    name: 4 · code quality
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Strict typecheck
        run: make typecheck-shared

  build:
    name: 5 · build
    needs: [lint, test, security]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: make build-shared
      - uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: shared/*/dist/**
          retention-days: 30
          if-no-files-found: error
