name: CI · shared

# Shared TypeScript packages (shared/*) underpin web/, desktop/, AND cli/
# (the proto file is consumed by all of them). When this workflow succeeds,
# ci-web, ci-cli, AND ci-desktop fire via `workflow_run` (each listens for
# our completion).
on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/ci-shared.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/ci-shared.yml'
  workflow_dispatch:

concurrency:
  group: ci-shared-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: 22

jobs:
  ci:
    name: shared (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: |
          pnpm --filter repoguru exec prettier --check '../shared/**/*.{ts,tsx,json,md}' || \
            pnpm --filter repoguru exec prettier --check 'shared/**/*.{ts,tsx,json,md}' || true
      - name: Typecheck shared/*
        run: make typecheck-shared
      - name: Build shared/*
        run: make build-shared
