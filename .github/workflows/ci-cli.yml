name: CI · cli

# Pipeline stages (each is a separate, named job — fail fast, parallel where safe):
#
#   guard       → gate cascade runs from CI · shared (success-only)
#   lint        → cargo fmt --check + cargo clippy -D warnings
#   test        → cargo test --release (unit + integration)
#   security    → cargo audit (CVEs) + cargo deny (licenses/advisories)
#   quality     → cargo llvm-cov (coverage report) + cargo machete (unused deps)
#   build       → multi-target release binaries → workflow artifacts
#
# Triggers:
#   • push/PR on cli/** or spec/**     → run pipeline
#   • workflow_run from CI · shared    → cascade (cli also re-validates on shared changes)
#   • workflow_dispatch                → on demand
on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'spec/**'
      - 'Cargo.toml'
      - '.github/workflows/ci-cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - 'spec/**'
      - 'Cargo.toml'
      - '.github/workflows/ci-cli.yml'
  workflow_run:
    workflows: ['CI · shared']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 0. Guard — cascade from CI · shared only proceeds on success.
  # ─────────────────────────────────────────────────────────────────────
  guard:
    name: 0 · guard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - if: github.event_name == 'workflow_run'
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "::warning::${{ github.event.workflow_run.name }} concluded ${{ github.event.workflow_run.conclusion }} — skipping"
            exit 78
          fi
      - run: echo "✅ proceed"

  # ─────────────────────────────────────────────────────────────────────
  # 1. Lint + style — format check, clippy with -D warnings.
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: 1 · lint + style
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: cli, shared-key: cli-release }
      - name: cargo fmt --check
        working-directory: cli
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        working-directory: cli
        run: cargo clippy --release --all-targets -- -D warnings

  # ─────────────────────────────────────────────────────────────────────
  # 2. Functional testing — unit + integration tests.
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: 2 · functional tests
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: cli, shared-key: cli-release }
      - name: Configure git identity (gix reflog needs a committer)
        run: |
          git config --global user.email "ci@repoguru.dev"
          git config --global user.name  "RepoGuru CI"
      - name: cargo test --release
        working-directory: cli
        run: cargo test --release

  # ─────────────────────────────────────────────────────────────────────
  # 3. Code security — CVE scanning + license/advisory enforcement.
  # ─────────────────────────────────────────────────────────────────────
  security:
    name: 3 · code security
    needs: guard
    runs-on: ubuntu-latest
    # cargo install cargo-deny builds from source on a cold cache (~7 min).
    # 25 min headroom keeps subsequent runs fast and accommodates the first.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: cli, shared-key: cli-release }
      - name: Install cargo-audit + cargo-deny
        run: |
          cargo install cargo-audit --locked --version ^0.20
          cargo install cargo-deny  --locked --version ^0.16
      - name: cargo audit (RUSTSEC advisories)
        working-directory: cli
        # Upstream rustsec/advisory-db has a malformed TOML
        # (libcrux-poly1305 / RUSTSEC-2026-0073) which crashes cargo-audit
        # before any CVE check runs. cargo-deny below covers the same
        # advisories cleanly, so don't gate on this until upstream fixes.
        continue-on-error: true
        run: cargo audit
      - name: cargo deny (advisories + bans + licenses)
        working-directory: cli
        # `bans` checks for duplicate-version pulls; `licenses` enforces our policy;
        # `sources` blocks crates from non-allowed registries. Advisory-only on this
        # first run — flip to `--all-features` + remove continue-on-error once a
        # `deny.toml` is committed alongside.
        continue-on-error: true
        run: cargo deny check advisories bans licenses sources

  # ─────────────────────────────────────────────────────────────────────
  # 4. Code quality — coverage report + unused-dep detection.
  # ─────────────────────────────────────────────────────────────────────
  quality:
    name: 4 · code quality
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: cli, shared-key: cli-release }
      - name: Install tools
        run: |
          cargo install cargo-llvm-cov --locked --version ^0.6
          cargo install cargo-machete  --locked --version ^0.7
      - name: Configure git identity (gix tests need it)
        run: |
          git config --global user.email "ci@repoguru.dev"
          git config --global user.name  "RepoGuru CI"
      - name: Coverage report
        working-directory: cli
        run: cargo llvm-cov --release --summary-only
      - name: Unused dependencies (advisory)
        working-directory: cli
        continue-on-error: true
        run: cargo machete

  # ─────────────────────────────────────────────────────────────────────
  # 5. Build artifacts — multi-target release binaries → workflow store.
  # PR runs skip this matrix (heavy); main + dispatch trigger the full set.
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: 5 · build · ${{ matrix.target }}
    needs: [lint, test, security]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  ext: ''     }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: ''     }
          - { os: macos-13,       target: x86_64-apple-darwin,       ext: ''     }
          # windows-latest now redirects to windows-2025-vs2026, where
          # protobuf-src 2.x fails to link against the MSVC 2026 CRT
          # (__imp__gmtime64_s and friends unresolved). Pin to 2022 until
          # protobuf-src ships a build that's clean on the new toolchain.
          - { os: windows-2022,   target: x86_64-pc-windows-msvc,    ext: '.exe' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: cli, key: "${{ matrix.target }}" }
      # Install precompiled protoc and point PROTOC at it. cli/build.rs
      # honours PROTOC if set, falling back to building protobuf-src from
      # source. This skips the slow C++ compile + sidesteps CRT/linker
      # issues that protobuf-src 2.x hits on the Windows MSVC toolchain.
      - uses: arduino/setup-protoc@v3
        with:
          version: '27.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set PROTOC env
        shell: bash
        run: |
          PROTOC_BIN=$(which protoc)
          echo "PROTOC=$PROTOC_BIN" >> "$GITHUB_ENV"
          "$PROTOC_BIN" --version
      - name: cargo build --release
        working-directory: cli
        run: cargo build --release --bin repoanalyze --target ${{ matrix.target }}
      - name: Stage artefact
        shell: bash
        run: |
          mkdir -p out
          cp cli/target/${{ matrix.target }}/release/repoanalyze${{ matrix.ext }} \
             out/repoanalyze-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: out/*
          retention-days: 30
          if-no-files-found: error
