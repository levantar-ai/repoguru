name: CI · cli

# Triggers:
#   • push/PR on cli/** or spec/**     → run CI + multi-target build
#   • workflow_run from CI · shared    → cascade after shared lands
#   • workflow_dispatch                → on demand
#
# Artifact policy: every run on main publishes the 4-target binary set as
# a workflow artifact (`cli-binaries`). The release-attach workflow pulls
# that artifact when a cli-v* tag fires.
on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'spec/**'
      - 'Cargo.toml'
      - '.github/workflows/ci-cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - 'spec/**'
      - 'Cargo.toml'
      - '.github/workflows/ci-cli.yml'
  workflow_run:
    workflows: ['CI · shared']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Guard (cascade gate)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check cascade preconditions
        if: github.event_name == 'workflow_run'
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "::warning::${{ github.event.workflow_run.name }} concluded ${{ github.event.workflow_run.conclusion }} — skipping cli pipeline"
            exit 78
          fi
      - run: echo "✅ proceed"

  # ─────────────────────────────────────────────────────────────────────
  # CI — clippy + tests on Linux only. Fast feedback path.
  # ─────────────────────────────────────────────────────────────────────
  ci:
    name: cli CI
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          shared-key: cli-release
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: make ci-cli

  # ─────────────────────────────────────────────────────────────────────
  # Build artifacts — multi-target binaries on every push to main and on
  # workflow_dispatch. PRs skip this matrix to keep PR CI quick.
  # The artifact is the source-of-truth for downstream releases; the
  # release-attach workflow downloads it when a cli-v* tag fires.
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: build · ${{ matrix.target }}
    needs: ci
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  ext: ''     }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: ''     }
          - { os: macos-13,       target: x86_64-apple-darwin,       ext: ''     }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: '.exe' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}
      - name: Build release binary
        working-directory: cli
        run: cargo build --release --bin repoanalyze --target ${{ matrix.target }}
      - name: Stage artefact
        shell: bash
        run: |
          mkdir -p out
          cp cli/target/${{ matrix.target }}/release/repoanalyze${{ matrix.ext }} \
             out/repoanalyze-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: out/*
          retention-days: 30
          if-no-files-found: error
