syntax = "proto3";

package repoanalyze.v1;

service RepoAnalyzeService {
  // Scan a repository, streaming progress updates.
  rpc Scan(ScanRequest) returns (stream ScanProgress);

  // Detect technologies in a repository.
  rpc DetectTech(DetectTechRequest) returns (DetectTechResponse);

  // Get report data from a completed scan.
  rpc GetReport(GetReportRequest) returns (GetReportResponse);

  // List available report sections.
  rpc ListSections(ListSectionsRequest) returns (ListSectionsResponse);

  // Get a single report section (lazy-loaded from binary tables).
  rpc GetSection(GetSectionRequest) returns (GetSectionResponse);

  // Describe a completed scan — what data is available and what sections can be computed.
  rpc DescribeScan(DescribeScanRequest) returns (DescribeScanResponse);

  // Health check.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ScanRequest {
  string repo_path = 1;
  string out_path = 2;
  optional uint32 threads = 3;
  string merge_policy = 4;     // "first-parent" or "all-parents"
  bool renames = 5;
  bool copies = 6;
  uint32 rename_threshold = 7;
  bool include_remotes = 8;
  uint32 max_top = 9;
  bool report = 10;
  uint32 max_diff_files = 11;
  uint32 merge_diff_limit = 12;
  uint32 worker_cache_mb = 13;
}

message ScanProgress {
  string phase = 1;            // "open", "walk", "diff", "sizer", "report", "done"
  string message = 2;
  uint64 commits_processed = 3;
  uint64 file_changes_processed = 4;
  double elapsed_seconds = 5;
  bool done = 6;
  string error = 7;            // Non-empty on failure
}

message DetectTechRequest {
  string repo_path = 1;
}

message DetectTechResponse {
  string json = 1;             // Full TechDetectResult as JSON
}

message GetReportRequest {
  string out_path = 1;         // Path to scan output directory
}

message GetReportResponse {
  string metrics_json = 1;     // Contents of metrics.json
  string timelines_json = 2;   // Contents of data/timelines.json
  string authors_json = 3;     // Contents of data/authors.json
  string hotspots_json = 4;    // Contents of data/hotspots.json
}

message ListSectionsRequest {}

message ListSectionsResponse {
  repeated SectionInfo sections = 1;
}

message SectionInfo {
  string name = 1;
  string description = 2;
  repeated string data_keys = 3;       // JSON keys returned by this section
  repeated string tables_needed = 4;   // Binary tables required (e.g. "commit_stats", "file_stats")
}

message GetSectionRequest {
  string out_path = 1;
  string section = 2;
  optional string repo_path = 3;
}

message GetSectionResponse {
  string section = 1;
  string data_json = 2;
}

message DescribeScanRequest {
  string out_path = 1;
}

message DescribeScanResponse {
  bool has_metrics = 1;
  bool has_commit_stats = 2;
  bool has_file_stats = 3;
  bool has_messages = 4;
  uint64 total_commits = 5;
  uint64 total_files_changed = 6;
  uint64 total_authors = 7;
  repeated string available_sections = 8;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
}
