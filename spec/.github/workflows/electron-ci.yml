name: Electron CI

on:
  push:
    branches: [ main ]
    paths:
      - 'repoguru-desktop/**'
      - '.github/workflows/electron-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'repoguru-desktop/**'
      - '.github/workflows/electron-ci.yml'

permissions:
  contents: read

concurrency:
  group: electron-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: repoguru-desktop

jobs:
  # 1. ESLint
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: repoguru-desktop/package-lock.json
      - run: npm ci
      - run: npm run lint

  # 2. TypeScript type check
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: repoguru-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # 3. Unit tests
  test:
    name: npm test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: repoguru-desktop/package-lock.json
      - run: npm ci
      - run: npm test

  # 4. npm audit (fail on high/critical)
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: repoguru-desktop/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  # 5. Playwright E2E
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: repoguru-desktop/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build renderer
        run: npm run build:renderer
      - name: Run E2E tests
        env:
          CI: true
        run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: playwright-report
          path: repoguru-desktop/playwright-report/
          retention-days: 7
