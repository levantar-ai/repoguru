syntax = "proto3";

package repoanalyze.v1;

service RepoAnalyzeService {
  // ── Existing ──

  // Scan a repository, streaming progress updates.
  rpc Scan(ScanRequest) returns (stream ScanProgress);

  // Detect technologies in a repository.
  rpc DetectTech(DetectTechRequest) returns (DetectTechResponse);

  // Get report data from a completed scan.
  rpc GetReport(GetReportRequest) returns (GetReportResponse);

  // List available report sections.
  rpc ListSections(ListSectionsRequest) returns (ListSectionsResponse);

  // Get a single report section (lazy-loaded from binary tables).
  rpc GetSection(GetSectionRequest) returns (GetSectionResponse);

  // Describe a completed scan — what data is available and what sections can be computed.
  rpc DescribeScan(DescribeScanRequest) returns (DescribeScanResponse);

  // Health check.
  rpc Health(HealthRequest) returns (HealthResponse);

  // ── New: Report Card & Scoring ──

  // Score a repository across 8 categories, returning a full report card.
  // Operates on HEAD tree (file presence checks) + scan data (git history metrics).
  rpc ScoreReportCard(ScoreRequest) returns (ScoreResponse);

  // ── New: Policy Engine ──

  // Evaluate a policy set against a scored report card.
  rpc EvaluatePolicy(PolicyRequest) returns (PolicyResponse);

  // ── New: SBOM ──

  // Generate a CycloneDX 1.5 SBOM from tech detection + dependency data.
  rpc GenerateSBOM(SBOMRequest) returns (SBOMResponse);

  // ── New: Export ──

  // Export report data in various formats (CSV, Markdown, Badge SVG, JSON).
  rpc ExportReport(ExportRequest) returns (ExportResponse);

  // ── New: Org Scan ──

  // Scan all repos in a GitHub org or user portfolio, streaming per-repo progress.
  rpc ScanOrg(OrgScanRequest) returns (stream OrgScanProgress);

  // ── New: Comparison ──

  // Compare two repositories side-by-side across all metrics.
  rpc CompareRepos(CompareRequest) returns (CompareResponse);
}

// ═══════════════════════════════════════════════════════════════
// Existing messages (unchanged)
// ═══════════════════════════════════════════════════════════════

message ScanRequest {
  string repo_path = 1;
  string out_path = 2;
  optional uint32 threads = 3;
  string merge_policy = 4;     // "first-parent" or "all-parents"
  bool renames = 5;
  bool copies = 6;
  uint32 rename_threshold = 7;
  bool include_remotes = 8;
  uint32 max_top = 9;
  bool report = 10;
  uint32 max_diff_files = 11;
  uint32 merge_diff_limit = 12;
  uint32 worker_cache_mb = 13;
}

message ScanProgress {
  string phase = 1;            // "open", "walk", "diff", "sizer", "report", "done"
  string message = 2;
  uint64 commits_processed = 3;
  uint64 file_changes_processed = 4;
  double elapsed_seconds = 5;
  bool done = 6;
  string error = 7;            // Non-empty on failure
}

message DetectTechRequest {
  string repo_path = 1;
}

message DetectTechResponse {
  string json = 1;             // Full TechDetectResult as JSON
}

message GetReportRequest {
  string out_path = 1;         // Path to scan output directory
}

message GetReportResponse {
  string metrics_json = 1;     // Contents of metrics.json
  string timelines_json = 2;   // Contents of data/timelines.json
  string authors_json = 3;     // Contents of data/authors.json
  string hotspots_json = 4;    // Contents of data/hotspots.json
}

message ListSectionsRequest {}

message ListSectionsResponse {
  repeated SectionInfo sections = 1;
}

message SectionInfo {
  string name = 1;
  string description = 2;
  repeated string data_keys = 3;       // JSON keys returned by this section
  repeated string tables_needed = 4;   // Binary tables required (e.g. "commit_stats", "file_stats")
}

message GetSectionRequest {
  string out_path = 1;
  string section = 2;
  optional string repo_path = 3;
}

message GetSectionResponse {
  string section = 1;
  string data_json = 2;
}

message DescribeScanRequest {
  string out_path = 1;
}

message DescribeScanResponse {
  bool has_metrics = 1;
  bool has_commit_stats = 2;
  bool has_file_stats = 3;
  bool has_messages = 4;
  uint64 total_commits = 5;
  uint64 total_files_changed = 6;
  uint64 total_authors = 7;
  repeated string available_sections = 8;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
}

// ═══════════════════════════════════════════════════════════════
// Report Card Scoring
// ═══════════════════════════════════════════════════════════════

message ScoreRequest {
  string repo_path = 1;           // Path to local git repo (for HEAD tree file checks)
  optional string out_path = 2;   // Path to scan output (for git history metrics enrichment)
}

message ScoreResponse {
  uint32 overall_score = 1;       // 0-100 weighted average
  string grade = 2;               // A/B/C/D/F
  repeated CategoryScore categories = 3;
  repeated string strengths = 4;
  repeated string risks = 5;
  repeated string next_steps = 6;
  string scored_at = 7;           // ISO 8601 timestamp
}

message CategoryScore {
  string key = 1;                 // e.g. "documentation", "security", "cicd"
  string label = 2;               // e.g. "Documentation", "Security"
  uint32 score = 3;               // 0-100
  string grade = 4;               // A/B/C/D/F
  double weight = 5;              // 0.0-1.0
  repeated Signal signals = 6;
}

message Signal {
  string name = 1;                // e.g. "README exists"
  bool found = 2;
  string details = 3;             // Optional context (e.g. "1234 characters")
  uint32 points = 4;              // Points this signal contributes when found
}

// ═══════════════════════════════════════════════════════════════
// Policy Engine
// ═══════════════════════════════════════════════════════════════

message PolicyRequest {
  // Either provide a preset name or a custom policy set
  string preset = 1;              // "basic-hygiene", "production-ready", "security-focused", or empty
  PolicySet custom_policy = 2;    // Custom rules (used if preset is empty)
  // The scored report card to evaluate against
  ScoreResponse report_card = 3;
}

message PolicySet {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated PolicyRule rules = 4;
}

message PolicyRule {
  string id = 1;
  string name = 2;
  string description = 3;
  string type = 4;                // "overall-score", "category-score", "signal"
  string operator = 5;            // ">=", ">", "<=", "<", "==", "exists", "not-exists"
  double value = 6;               // Threshold for score rules
  string category = 7;            // Category key for "category-score" type
  string signal = 8;              // Signal name for "signal" type
  string severity = 9;            // "error", "warning", "info"
}

message PolicyResponse {
  bool passed = 1;
  uint32 pass_count = 2;
  uint32 fail_count = 3;
  repeated PolicyRuleResult results = 4;
  string evaluated_at = 5;
}

message PolicyRuleResult {
  PolicyRule rule = 1;
  bool passed = 2;
  string actual = 3;              // e.g. "Documentation score: 75"
  string expected = 4;            // e.g. ">= 60"
}

// ═══════════════════════════════════════════════════════════════
// SBOM Generation
// ═══════════════════════════════════════════════════════════════

message SBOMRequest {
  string repo_path = 1;           // Path to local git repo
  string format = 2;              // "cyclonedx-json" (default), "cyclonedx-xml", "spdx-json"
}

message SBOMResponse {
  string format = 1;              // Format used
  string content = 2;             // The SBOM document as string
  uint32 component_count = 3;     // Number of components detected
}

// ═══════════════════════════════════════════════════════════════
// Export
// ═══════════════════════════════════════════════════════════════

message ExportRequest {
  string format = 1;              // "csv", "markdown", "badge-svg", "json"
  ScoreResponse report_card = 2;  // The scored report card
  string repo_name = 3;           // "owner/repo" for display
  // Badge-specific options
  string badge_style = 4;         // "flat", "flat-square", "pill"
  string badge_label = 5;         // Custom label (default: "repo health")
}

message ExportResponse {
  string format = 1;
  string content = 2;             // The exported content
  string content_type = 3;        // MIME type (e.g. "text/csv", "image/svg+xml")
}

// ═══════════════════════════════════════════════════════════════
// Org Scan
// ═══════════════════════════════════════════════════════════════

message OrgScanRequest {
  string org_or_user = 1;         // GitHub org name or username
  bool is_user = 2;               // true = user portfolio, false = org scan
  string github_token = 3;        // PAT for GitHub API access
  string clone_base_dir = 4;      // Base directory for cloning repos
  uint32 max_repos = 5;           // Limit (0 = all)
  bool skip_forks = 6;            // Skip forked repositories
  bool skip_archived = 7;         // Skip archived repositories
}

message OrgScanProgress {
  string phase = 1;               // "listing", "cloning", "scanning", "scoring", "done"
  string repo_name = 2;           // Current repo being processed
  uint32 repos_total = 3;
  uint32 repos_completed = 4;
  // When phase="done", these fields contain the final results
  repeated RepoScore repo_scores = 5;
  double average_score = 6;
  string average_grade = 7;
  string error = 8;
}

message RepoScore {
  string repo_name = 1;           // "owner/repo"
  uint32 overall_score = 2;
  string grade = 3;
  repeated CategoryScore categories = 4;
}

// ═══════════════════════════════════════════════════════════════
// Repo Comparison
// ═══════════════════════════════════════════════════════════════

message CompareRequest {
  string repo_path_a = 1;         // Path to first repo
  string repo_path_b = 2;         // Path to second repo
  optional string out_path_a = 3; // Scan output for repo A (for history metrics)
  optional string out_path_b = 4; // Scan output for repo B
}

message CompareResponse {
  ScoreResponse report_card_a = 1;
  ScoreResponse report_card_b = 2;
  repeated ComparisonDelta deltas = 3;  // Per-category deltas
  string winner = 4;              // "a", "b", or "tie"
  int32 score_delta = 5;          // A.score - B.score
}

message ComparisonDelta {
  string category = 1;            // Category key
  int32 score_a = 2;
  int32 score_b = 3;
  int32 delta = 4;                // score_a - score_b
  string winner = 5;              // "a", "b", or "tie"
}
