appId: com.repoguru.desktop
productName: RepoGuru
copyright: Copyright © 2026 RepoGuru
directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - dist-electron/**/*

extraResources:
  - from: resources/bin/
    to: bin/
    filter:
      - '!**/.gitkeep'

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: repoguru
  repo: repoguru-desktop
