name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Run tests
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

    - name: Run tests
      env:
        GIT_AUTHOR_NAME: CI
        GIT_AUTHOR_EMAIL: ci@test.com
        GIT_COMMITTER_NAME: CI
        GIT_COMMITTER_EMAIL: ci@test.com
      run: cargo test --verbose

  # 2. Quality checks
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy -- -D warnings

  # 3. Security scan
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit

  # 4. Build binaries (matrix: linux, macos, windows)
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: repoanalyze-linux-amd64
            binary_name: repoanalyze
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: repoanalyze-linux-arm64
            binary_name: repoanalyze
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: repoanalyze-macos-amd64
            binary_name: repoanalyze
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: repoanalyze-macos-arm64
            binary_name: repoanalyze
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: repoanalyze-windows-amd64
            binary_name: repoanalyze.exe
    runs-on: ${{ matrix.os }}
    needs: [test, quality, security]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross-compilation tools (Linux ARM64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
        echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

    - name: Cache cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Package binary (unix)
      if: runner.os != 'Windows'
      run: |
        mkdir -p output
        cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} output/${{ matrix.binary_name }}
        cd output
        tar czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.binary_name }}

    - name: Package binary (windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path output
        Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "output/${{ matrix.binary_name }}"
        Compress-Archive -Path "output/${{ matrix.binary_name }}" -DestinationPath "output/${{ matrix.artifact_name }}.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: output/${{ matrix.artifact_name }}.*

  # 5. Get version from semantic-release dry run
  version:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      version: ${{ steps.semrel.outputs.version }}
      new_release: ${{ steps.semrel.outputs.version != '' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Semantic release dry run
      uses: go-semantic-release/action@v1
      id: semrel
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        changelog-generator-opt: "emojis=true"
        dry: true

    - name: Show version
      env:
        SEM_VERSION: ${{ steps.semrel.outputs.version }}
      run: |
        echo "Version: ${SEM_VERSION}"
        echo "New release: $([ -n '${SEM_VERSION}' ] && echo true || echo false)"

  # 6. Semantic release (create tag and changelog)
  release:
    runs-on: ubuntu-latest
    needs: version
    if: github.ref == 'refs/heads/main' && needs.version.outputs.new_release == 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Semantic release
      uses: go-semantic-release/action@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        changelog-generator-opt: "emojis=true"

  # 7. Upload artifacts to GitHub release
  upload:
    runs-on: ubuntu-latest
    needs: [version, release]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.new_release == 'true'
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: List artifacts
      run: find ./artifacts -type f | sort

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        RELEASE_TAG: v${{ needs.version.outputs.version }}
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        files: |
          artifacts/repoanalyze-linux-amd64/*.tar.gz
          artifacts/repoanalyze-linux-arm64/*.tar.gz
          artifacts/repoanalyze-macos-amd64/*.tar.gz
          artifacts/repoanalyze-macos-arm64/*.tar.gz
          artifacts/repoanalyze-windows-amd64/*.zip
        token: ${{ secrets.GITHUB_TOKEN }}
