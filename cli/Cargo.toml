[package]
name = "repoanalyze"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "repoanalyze"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
gix = { version = "0.84", default-features = false, features = ["blocking-network-client", "revparse-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
crossbeam-channel = "0.5"
rayon = "1"
hashbrown = "0.15"
smallvec = "1"
bytes = "1"
imara-diff = "0.1"
regex = "1"
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }

# protobuf-src compiles protobuf 27.x from C++ source via cmake. That's
# fine on macOS/Linux but fails to link on Windows MSVC (CRT mismatch
# between Debug and Release variants). Restrict it to non-Windows; on
# Windows we install precompiled protoc via arduino/setup-protoc and
# point PROTOC at it (see cli/build.rs + .github/workflows/ci-cli.yml).
[target.'cfg(not(target_os = "windows"))'.build-dependencies]
protobuf-src = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
blake3 = "1"

# Newer toolchains add stricter clippy lints. These three are stylistic — not bugs:
#   * result_large_err: tonic::Status is 176 B; boxing every Err is more churn than it's worth.
#   * format_in_format_args: rare in this code, hits the giant report HTML template once.
#   * unnecessary_sort_by: sort_by(|a,b| a.x.cmp(&b.x)) and sort_by_key are equivalent here.
# Allow them at the crate level rather than littering #[allow(..)] across files.
[lints.clippy]
result_large_err = "allow"
format_in_format_args = "allow"
unnecessary_sort_by = "allow"
